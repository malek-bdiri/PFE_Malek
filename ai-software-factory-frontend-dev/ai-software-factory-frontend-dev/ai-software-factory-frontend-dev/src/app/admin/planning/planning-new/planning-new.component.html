

      <!-- Title -->
      <h1 class="text-3xl font-bold mb-2">Nouveau Planning</h1>
      <p class="text-gray-500 mb-6">Étape 1 sur 2</p>

      <!-- Progress -->
      <div class="w-full h-2 bg-gray-200 rounded-full mb-8">
        <div class="h-2 bg-blue-600 rounded-full w-1/2"></div>
      </div>

      <!-- CARD -->
      <div class="bg-white rounded-xl shadow border p-6 overflow-visible">

        <h2 class="text-lg font-semibold mb-6">
          Sélectionner un projet
        </h2>

        <label class="block text-sm font-medium mb-2">
          Projet *
        </label>

        <!-- Dropdown -->
        <div class="relative w-full">

          <!-- Button -->
          <button
            type="button"
            (click)="toggleProjectDropdown()"
            class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl text-left flex justify-between items-center focus:ring-2 focus:ring-blue-500"
          >
            <span>
              {{ selectedProjetName || 'Sélectionner un projet' }}
            </span>
            <span>▼</span>
          </button>

          <!-- Options -->
          <div
            *ngIf="showProjectDropdown"
            class="absolute z-50 mt-2 w-full bg-white border rounded-xl shadow-lg max-h-60 overflow-y-auto"
          >
            <div
              *ngFor="let projet of projets"
              (click)="selectProjet(projet)"
              class="px-4 py-3 hover:bg-gray-100 cursor-pointer"
            >
              {{ projet.nom }}
            </div>
          </div>

        </div>

        

        <!-- Button -->
        <div class="flex justify-end mt-6">
          <button
            (click)="goToStep2()"
            class="px-6 py-3 rounded-xl text-white bg-blue-600 hover:bg-blue-700"
          >
            Suivant →
          </button>
        </div>

      </div>
<!-- TOAST ERROR -->
<div *ngIf="errorMessage"
     class="fixed bottom-6 right-6 z-50">

  <div class="bg-white shadow-2xl border border-gray-200 rounded-xl px-6 py-4 flex items-center gap-3 min-w-[320px] animate-slideIn">

    <!-- Black circle icon -->
    <div class="bg-black text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold">
      !
    </div>

    <!-- Message -->
    <p class="text-sm text-gray-800">
      {{ errorMessage }}
    </p>

  </div>

</div>
