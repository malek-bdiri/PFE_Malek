<div class="min-h-screen bg-gray-50">

  <!-- SIDEBAR -->
  <aside
    [class.translate-x-0]="sidebarOpen"
    [class.-translate-x-full]="!sidebarOpen"
    class="fixed inset-y-0 left-0 z-50 w-72 bg-white text-gray-900 shadow-lg transition-transform duration-300 ease-in-out lg:translate-x-0"
  >
    <div class="flex items-center justify-center h-28 px-4 bg-white border-b">
      <img src="/assets/images/logo1.jpg" alt="Logo" class="h-16 w-auto mr-3 object-contain">
    </div>

    <nav class="flex-1 px-3 py-6 space-y-1">
      <a *ngFor="let item of menuItems; let i = index"
         [routerLink]="item.route"
         routerLinkActive="bg-blue-100 text-blue-700"
         (click)="setActiveMenu(i)"
         class="flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors duration-150 cursor-pointer text-gray-700 hover:bg-gray-100">

        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
  <path *ngIf="item.icon === 'home'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
  <path *ngIf="item.icon === 'document'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
 <path *ngIf="item.icon === 'chart'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
  d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
  <path *ngIf="item.icon === 'warning'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
  <path *ngIf="item.icon === 'analyse'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
  <path *ngIf="item.icon === 'technique'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
  <path *ngIf="item.icon === 'uiux'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/>
  <path *ngIf="item.icon === 'dev'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
  <path *ngIf="item.icon === 'architecture'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
  <path *ngIf="item.icon === 'test'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
  <path *ngIf="item.icon === 'tracabilite'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
  <path *ngIf="item.icon === 'automation'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
  <path *ngIf="item.icon === 'ai'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
  <path *ngIf="item.icon === 'settings'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
</svg>

        {{ item.label | translate }}
      </a>
    </nav>
  </aside>

  <!-- MAIN -->
  <div [class.lg:pl-72]="sidebarOpen" class="transition-all duration-300">

    <!-- HEADER -->
    <header class="bg-white border-b border-gray-200">
      <div class="flex items-center justify-between px-6 py-3">

        <div class="flex items-center space-x-4">
          <button (click)="toggleSidebar()" class="lg:hidden p-2 rounded-md hover:bg-gray-100">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>

          <div class="hidden md:block relative">
            <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" placeholder="{{ 'commun.rechercher' | translate }}"
                   class="pl-10 pr-4 py-2 w-96 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="flex items-center space-x-4">
          <div class="flex items-center gap-2">
            <button *ngFor="let lang of languageService.availableLanguages"
                    (click)="changeLanguage(lang.code)"
                    [class.bg-blue-600]="languageService.current === lang.code"
                    [class.text-white]="languageService.current === lang.code"
                    class="px-3 py-1 rounded-lg border border-gray-200 hover:border-blue-300 transition-colors text-sm">
              {{ lang.flag }} {{ lang.code.toUpperCase() }}
            </button>
          </div>

          <button class="relative p-2 rounded-full hover:bg-gray-100">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
          </button>

          <div class="relative pl-4 border-l border-gray-200">
            <button (click)="toggleProfileDropdown()"
                    class="flex items-center space-x-3 hover:bg-gray-50 rounded-lg p-2">
              <div class="text-right hidden md:block">
                <p class="text-sm font-semibold text-gray-800">
                  {{ currentUser?.firstname }} {{ currentUser?.lastname }}
                </p>
                <p class="text-xs text-gray-500">{{ currentUser?.role }}</p>
              </div>
              <div class="h-10 w-10 rounded-full bg-blue-600 flex items-center justify-center">
                <span class="text-white font-bold text-sm">
                  {{ currentUser?.firstname?.charAt(0) }}{{ currentUser?.lastname?.charAt(0) }}
                </span>
              </div>
              <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <div *ngIf="showProfileDropdown"
                 class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
              <div class="px-4 py-3 border-b border-gray-200">
                <p class="text-sm font-semibold">{{ currentUser?.firstname }} {{ currentUser?.lastname }}</p>
                <p class="text-xs text-gray-500 mt-1">{{ currentUser?.email }}</p>
              </div>
              <div class="border-t border-gray-200 my-1"></div>
              <button (click)="logout()"
                      class="w-full flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                {{ 'commun.deconnexion' | translate }}
              </button>
            </div>
          </div>
        </div>

      </div>
    </header>

    <!-- CONTENU DYNAMIQUE -->
    <main class="p-6">
      <router-outlet></router-outlet>
    </main>

  </div>

  <!-- Overlay mobile -->
  <div *ngIf="!sidebarOpen" (click)="toggleSidebar()"
       class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"></div>
</div>
