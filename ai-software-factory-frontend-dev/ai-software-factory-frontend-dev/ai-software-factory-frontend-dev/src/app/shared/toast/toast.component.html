<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 w-80 pointer-events-none">
  <div *ngFor="let toast of toasts; trackBy: trackById"
       class="pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm"
       [ngClass]="{
         'bg-green-50 border-green-200 text-green-900': toast.type === 'success',
         'bg-red-50 border-red-200 text-red-900': toast.type === 'error',
         'bg-yellow-50 border-yellow-200 text-yellow-900': toast.type === 'warning',
         'bg-blue-50 border-blue-200 text-blue-900': toast.type === 'info'
       }">

    <!-- Icon -->
    <div class="shrink-0 mt-0.5">
      <svg *ngIf="toast.type === 'success'" class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <svg *ngIf="toast.type === 'error'" class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <svg *ngIf="toast.type === 'warning'" class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <svg *ngIf="toast.type === 'info'" class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>

    <div class="flex-1 min-w-0">
      <p *ngIf="toast.title" class="font-semibold text-sm mb-0.5">{{ toast.title }}</p>
      <p class="text-sm leading-snug opacity-90">{{ toast.message }}</p>
    </div>

    <button (click)="dismiss(toast.id)"
            class="shrink-0 mt-0.5 p-0.5 rounded opacity-50 hover:opacity-100 transition-opacity">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>
</div>
